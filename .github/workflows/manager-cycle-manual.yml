name: Padma Bangla News Manager — Manual Cycle

on:
  workflow_dispatch:
    inputs:
      run_live_rss:
        description: "Fetch enabled public RSS feeds (network access)"
        required: true
        type: boolean
        default: false
      run_openrouter:
        description: "Generate Bengali AI draft candidates (requires RSS)"
        required: true
        type: boolean
        default: false
      create_blogger_drafts:
        description: "Create Blogger DRAFTS only (requires RSS and OpenRouter)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  manual-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run guarded manual cycle
        env:
          PADMA_RUN_LIVE_RSS: ${{ inputs.run_live_rss }}
          PADMA_RUN_OPENROUTER: ${{ inputs.run_openrouter }}
          PADMA_CREATE_BLOGGER_DRAFTS: ${{ inputs.create_blogger_drafts }}
          PADMA_MAX_STORIES: "5"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          BLOGGER_ACCESS_TOKEN: ${{ secrets.BLOGGER_ACCESS_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m manager.run_cycle
      - name: Upload private run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padma-manager-cycle-report
          path: manager-cycle-result.json
          if-no-files-found: ignore
          retention-days: 3
