name: Facebook Page Read-Only Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-facebook-page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Facebook Page read access
        env:
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID || secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python scripts/facebook_page_check.py
