name: Manager Offline Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Run manager unit tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run manager unit tests
        run: python -m unittest discover -s manager_tests -v
